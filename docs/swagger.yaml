  /v1/inri/invoices/{invoiceId}/attachments:
    get:
      consumes:
      - application/json
      description: Returns a list of attachments by invoice ID
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Attachment'
            type: array
      tags:
      - Invoices
    post:
      consumes:
      - multipart/form-data
      description: Upload multiple files as attachments for the given invoice
      parameters:
      - description: Invoice ID
        in: path
        name: invoiceId
        required: true
        type: string
      - collectionFormat: csv
        description: Files to upload
        in: formData
        items:
          type: file
        name: files
        required: true
        type: array
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
