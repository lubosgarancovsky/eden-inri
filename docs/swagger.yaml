      description: Updates an existing invoice
      parameters:
      - description: Invoice data
        in: body
        name: invoice
        required: true
        schema:
          $ref: '#/definitions/model.InvoiceRequest'
      - description: Invoice ID
        in: path
        name: invoiceId
        required: true
