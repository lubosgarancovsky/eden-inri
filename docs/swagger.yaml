paths:
  /v1/inri/attachments:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all attachments
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: pageSize
        type: integer
      - description: RSQL filter query
        in: query
        name: filter
        type: string
      - description: Sort query
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AttachmentPage'
      tags:
      - Attachments
  /v1/inri/attachments/{attachmentId}:
    delete:
      consumes:
      - application/json
      description: Deletes the attachment (database). File deletion may be added later.
      parameters:
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
      tags:
      - Attachments
    get:
      consumes:
      - application/json
      description: Returns an attachment by its ID
      parameters:
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Attachment'
      tags:
      - Attachments
  /v1/inri/attachments/{attachmentId}/download:
    get:
      description: Downloads the attachment file from disk using the stored path
      parameters:
      - description: Attachment ID
        in: path
        name: attachmentId
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
      tags:
      - Attachments
  /v1/inri/clients:
    get:
      consumes:
      - application/json
      description: Returns a paginated list of all clients
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: pageSize
        type: integer
      - description: RSQL filter query
        in: query
        name: filter
        type: string
      - description: Sort query
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ClientPage'
      tags:
      - Clients
    post:
      consumes:
      - application/json
      description: Registers a new OAuth client in the IAM system
      parameters:
      - description: Client data
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/model.ClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.Client'
      tags:
      - Clients
  /v1/inri/clients/{clientId}:
    delete:
      consumes:
      - application/json
      description: Deletes the OAuth client from the IAM system
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
      tags:
      - Clients
    get:
      consumes:
      - application/json
      description: Returns a client by its ID
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Client'
      tags:
      - Clients
    put:
      consumes:
      - application/json
      description: Updates an existing OAuth client in the IAM system
      parameters:
      - description: Client data
        in: body
        name: client
        required: true
        schema:
          $ref: '#/definitions/model.ClientRequest'
      - description: Client ID
        in: path
        name: clientId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Client'
      tags:
      - Clients
